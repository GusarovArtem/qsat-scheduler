[project]
name = "qsat-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datetime>=6.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "skyfield>=1.54",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
# E - style PEP 8
# F - logic errors for ex. unused imports
# I - imports order
select = ["E", "F","I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" # to make rsat be imported glibally inside venv
[tool.hatch.build.targets.wheel]
packages = ["src/qsat"]

[project.scripts]
qsat = "qsat.cli:app"